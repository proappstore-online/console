<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Brand theme color (matches proappstore.online): paper light / ink dark. -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="darkreader-lock" />
    <link rel="manifest" href="/manifest.json" />
    <!-- ProAppStore brand mark: purple-gradient "A" (BRAND.md). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Creator Console — ProAppStore</title>
    <meta name="description" content="Manage and build your apps on ProAppStore — the creator console." />
    <!-- Social/share cards (brand parity with proappstore.online). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Creator Console — ProAppStore" />
    <meta property="og:description" content="Manage and build your apps on ProAppStore." />
    <meta property="og:url" content="https://console.proappstore.online/" />
    <meta property="og:image" content="https://console.proappstore.online/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Structured data — exceeds the storefront's head (adopted from PAGS). -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"ProAppStore Creator Console","url":"https://console.proappstore.online","applicationCategory":"DeveloperApplication","description":"Manage and build your apps on ProAppStore."}</script>
    <!-- CF Web Analytics beacon for the console itself. Cookieless, no PII.
         Token is the literal string until set; replace PROAPPSTORE_CONSOLE_CF_BEACON_TOKEN
         with the real Web Analytics site_token from the CF dashboard
         (or wire a build-time substitution if/when the console grows a build pipeline). -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token":"PROAPPSTORE_CONSOLE_CF_BEACON_TOKEN"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

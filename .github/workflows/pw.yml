name: Playwright

# E2E for the Creator Console + PAS backend API:
# - `chromium`: the public-only smoke suite against prod
#   (console.proappstore.online + api.proappstore.online). Auth-gated prod
#   flows aren't covered; they need a real session token which CI doesn't have.
# - `operator-flow`: the admin (operator) flow end to end (platform#300) on the
#   console built from this commit and served by `vite preview` (Playwright
#   webServer), signed in with a fake token against an in-memory fake API.
# - mobile promoter flows on Chromium and WebKit, with SDK OAuth return routing
#   and synthetic enrollment/referral fixtures against the local build.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pw.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pw.yml'
  workflow_dispatch:
  schedule:
    # Daily smoke — surfaces prod regressions even without a code change.
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: pw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries so we don't re-download
      # Chromium and WebKit on every run. OS dependencies are installed below
      # even on a cache hit, because the runner itself is new each time.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and WebKit
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright
        working-directory: web
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

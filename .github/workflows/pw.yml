name: Playwright

# E2E smoke for the Creator Console + PAS backend API. Runs the
# public-only Playwright suite against prod (console.proappstore.online +
# api.proappstore.online). Auth-gated flows aren't covered here; they
# need a real FAS session token which CI doesn't have.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pw.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pw.yml'
  workflow_dispatch:
  schedule:
    # Daily smoke — surfaces prod regressions even without a code change.
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: pw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries so we don't re-download
      # Chromium (~150 MB) on every run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: web
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
